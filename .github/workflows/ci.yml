name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; no job here needs more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # pnpm version is pinned via `packageManager` in package.json — no
        # explicit version here so the two stay in sync.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail-fast: type errors block merge, build catches anything tsc
      # misses (e.g. Vite resolve issues).
      - run: pnpm typecheck

      - run: pnpm build

  # deploy/base/README.md claims this workload is `restricted`-compatible.
  # A claim in a README rots silently, so it is a gate instead of a sentence:
  # whoever makes it false has to see it fail here.
  deploy-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: pip install --no-cache-dir pyyaml

      # kubectl ships on the GitHub runner image; `kubectl kustomize` needs no
      # cluster, so this stays a pure static check.
      - name: Render and check deploy/base
        run: kubectl kustomize deploy/base | python3 scripts/check-deploy-hardening.py
