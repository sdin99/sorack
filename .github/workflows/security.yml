name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "40 6 * * 1"   # re-scan weekly with a fresh CVE database even if the code did not change

permissions:
  contents: read
  pull-requests: read

jobs:
  # Shared security gate, called from a local byte copy (this repo is public and cannot call the private homelab one).
  #   The copy must stay byte-identical to homelab@486887bc (v1.0.2) .github/workflows/security-scan.yml, git blob 937155f2.
  # The job name 'scan' becomes the check name 'scan / ...' that the main branch ruleset requires.
  scan:
    uses: ./.github/workflows/security-scan.yml
