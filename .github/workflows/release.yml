# Build and publish the container image to GHCR.
#
# Two triggers, two kinds of tag:
#   push to main  → sha-<short>   — what a homelab overlay pins day to day
#   push of v*    → v1.2.3, 1.2   — release tags
#
# There is deliberately no `latest`: POLICY [3.1] forbids deploying a mutable
# tag, and publishing one just invites someone to use it.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build (but never push) on PRs that touch packaging, so a broken
  # Dockerfile fails in review instead of on main.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - "api/**"
      - "web/**"
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io; scoped to this job only.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Skipped for pull_request, where the push step is a no-op anyway.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keeps the pnpm install layer warm between
          # runs; without it every build re-resolves the whole workspace.
          cache-from: type=gha
          cache-to: type=gha,mode=max
