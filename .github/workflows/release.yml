# Build and publish the container image to GHCR.
#
# Two triggers, two kinds of tag:
#   push to main  → sha-<short>   — what a homelab overlay pins day to day
#   push of v*    → v1.2.3        — release tags
#
# That split is enforced in the `tags:` block below, not just described here.
# It used to be only described: `type=sha` ran on every event, so a release
# built the image twice — once from the main push, once from the tag push —
# and both builds claimed `sha-<short>`. Measured on v0.1.7 (5f45fc5): the
# tag pointed at sha256:4eb3f96b… at 01:32 and sha256:e04584c1… at 01:33,
# and the displaced digest was left with no tags at all, so a pin written by
# tag name could later resolve to a GC candidate. `sha-<commit>` reads like a
# content address and was not one.
#
# There is deliberately no `latest`: POLICY [3.1] forbids deploying a mutable
# tag, and publishing one just invites someone to use it.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build (but never push) on PRs that touch packaging, so a broken
  # Dockerfile fails in review instead of on main.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - "api/**"
      - "web/**"
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to ghcr.io; scoped to this job only.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Required for `cache-to: type=gha` below — the default `docker` driver
      # cannot export a cache, and fails the build before the Dockerfile is
      # even read.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is added by default for semver tags, and {{major}}.{{minor}}
          # is mutable too. Both contradict POLICY 3.1 and this repo's own
          # deploy/base/README, which tells people to pin a digest — and a
          # public repo is exactly where someone copies `:latest` out of a
          # README. Only immutable references are published.
          flavor: |
            latest=false
          # The `enable=` below is load-bearing, not decoration: without it the
          # sha- line also fires on the tag push and overwrites the main
          # build's tag (see the header). A release commit therefore ends up
          # with two digests — sha-<commit> from main, <version> from the tag.
          # That is correct. The builds are not reproducible, so one name
          # covering both would have to lie about one of them.
          #
          # Kept as a YAML comment rather than a `#` line inside `tags:`. The
          # action does strip those, but the value of that stripping is a
          # behaviour of a third-party action, and the last two bugs in this
          # file were both a metadata-action behaviour differing from what the
          # comment beside it claimed.
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}

      # Skipped for pull_request, where the push step is a no-op anyway.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keeps the pnpm install layer warm between
          # runs; without it every build re-resolves the whole workspace.
          cache-from: type=gha
          cache-to: type=gha,mode=max
