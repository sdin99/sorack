# End-to-end: a real browser against a real build against a real Postgres.
#
# Separate from ci.yml because it is the only job here that needs a database
# and a built bundle, and because its failures mean something different: ci
# says the code is consistent, this says a person can still use it. The three
# UI faults found by hand in v0.1.4 all passed ci.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: sorack
          POSTGRES_PASSWORD: sorack-ci-not-a-secret
          POSTGRES_DB: sorack_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sorack"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Build the app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # tsc does not emit .sql; the server applies these on boot.
          cp -r api/src/db/migrations api/dist/db/migrations

      - name: Install e2e deps and a browser
        working-directory: e2e
        run: |
          # --ignore-workspace: this package installs on its own. See
          # e2e/scripts/guard-workspace.mjs for what happens without it.
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start sorack
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: sorack_e2e
          POSTGRES_USERNAME: sorack
          POSTGRES_PASSWORD: sorack-ci-not-a-secret
          SORACK_AUTH_SECRET: ci-auth-secret-not-a-secret
          SORACK_ADMIN_PASSWORD: e2e-password-not-a-secret
          # ‼ Required. The default is true, and over plain http a secure
          # cookie is dropped by the browser: login returns 200 and every
          # request after it is 401, with no error on screen. 01-login.spec
          # asserts the session is accepted, so this is checked rather than
          # assumed — but if you remove it, that is the test that fails and
          # this comment is the explanation.
          SORACK_COOKIE_SECURE: "false"
          # The collector would otherwise probe whatever the fixtures create.
          SORACK_HEALTH_ENABLED: "false"
          SORACK_RUNBOOKS_DIR: ${{ runner.temp }}/runbooks
          SORACK_STATIC_DIR: ${{ github.workspace }}/web/dist
          PORT: "3099"
        run: |
          mkdir -p "$SORACK_RUNBOOKS_DIR"
          node api/dist/server.js > "$RUNNER_TEMP/sorack.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sorack.pid"
          for _ in $(seq 1 60); do
            curl -sf --max-time 2 http://127.0.0.1:3099/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::sorack did not become healthy"
          cat "$RUNNER_TEMP/sorack.log"
          exit 1

      - name: Run the suite
        working-directory: e2e
        env:
          SORACK_E2E_URL: http://127.0.0.1:3099
        run: pnpm exec playwright test

      # The app log is where a failure that is not the browser's fault shows
      # up — a migration that did not run, a 500 behind a timeout.
      - name: sorack log
        if: failure()
        run: cat "$RUNNER_TEMP/sorack.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
