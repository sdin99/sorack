# Time-boxed deferrals for findings tracked in SEC-126, not dismissals.
#
# Every entry carries `expired_at`. After that date trivy stops honouring it
# and CI goes red again on its own — nobody has to remember to come back.
# That is the point: an ignore file without expiry is how a "we'll fix it
# next sprint" becomes permanent and invisible.
#
# NONE of these downgrade a severity. The astro finding is still CRITICAL;
# what is deferred is the gate, not the rating. Deciding a CVE is harmless
# because the vulnerable API "looks unused" puts that judgement in a one-line
# file that nobody re-reads when the code changes six months later.
#
# Ticket: SEC-126 (P2, due 2026-10-08) — ~/projects/security/assignments/sorack.md
# Fixed in this PR and deliberately absent below: hono CVE-2026-54290,
# drizzle-orm CVE-2026-39356.

vulnerabilities:
  - id: GHSA-26w7-cxv4-gfx2
    statement: >-
      astro 6.4.8 → 7.2.8, RCE via AVIF image optimization. Severity stands at
      CRITICAL. Deferred because the fix is a major upgrade of the marketing
      site (site/), which needs its own PR and its own build verification —
      not because the risk was judged away. Exposure is narrower than the
      rating suggests (the site is a static build; no astro:assets / <Image> /
      getImage call appears in site/src), but that observation is a reason to
      schedule rather than a reason to dismiss: it says the source does not
      call the API today, not that the code path cannot run.
    expired_at: 2026-10-08

  # trivy lists the same advisory under both its CVE and its GHSA id, as
  # separate rows. Ignoring one does not cover the other — the ids below are
  # aliases of the two app-side entries, not extra findings.
  - id: GHSA-qwww-vcr4-c8h2
    statement: Alias of CVE-2026-55685 (react-router). See that entry.
    expired_at: 2026-10-08

  - id: GHSA-5p4m-2wfm-xmqj
    statement: Alias of CVE-2026-59869 / CVE-2026-84375 (js-yaml). See those entries.
    expired_at: 2026-10-08

  - id: CVE-2026-59870
    statement: js-yaml, same package and remediation path as CVE-2026-59869.
    expired_at: 2026-10-08

  - id: CVE-2026-55685
    statement: >-
      react-router 7.16.0 → 7.18.0. A cheap minor bump, held back only to keep
      this PR reviewable — it adds the scanners, and fixing every finding in
      the same change would make the diff unreadable. Should be the first
      thing closed under SEC-126.
    expired_at: 2026-10-08

  - id: CVE-2026-59869
    statement: >-
      js-yaml DoS via crafted YAML. Transitive (gray-matter in api, astro in
      site), so it cannot be bumped directly — it needs either a parent
      upgrade or a pnpm override. Sorack parses YAML from runbook frontmatter,
      which is operator-authored content on a volume only the operator writes
      to, so the untrusted-input path is narrow today. That changes the day
      runbooks arrive over git sync from a remote someone else can push to.
    expired_at: 2026-10-08

  - id: CVE-2026-84375
    statement: >-
      js-yaml DoS, same package and same remediation path as CVE-2026-59869.
    expired_at: 2026-10-08

# ── site/ (marketing site) ────────────────────────────────────────────────
#
# The remaining findings all sit in site/package-lock.json: nanoid, postcss,
# sharp, smol-toml, svgo. Every one is a transitive dependency of astro, so
# they close together when astro 6 -> 7 lands in its own PR (SEC-126). Listing
# them individually would be noise that goes stale the moment that tree moves.
#
# This is the broadest entry in the file and it is deliberately the one with
# the clearest expiry. It is a deferral of a known, ticketed upgrade — not a
# statement that site dependencies do not matter.
#
# ‼ The better fix is structural, and is with secops: site/ is a static
# marketing page built by Cloudflare Pages, not part of the shipped image. It
# has its own lifecycle and its own lockfile, so folding it into the app's
# gate means site churn blocks app PRs and vice versa. Splitting the scan
# would let the astro PR close its own gate without a blanket entry here.
  - id: "*"
    paths:
      - "site/package-lock.json"
    statement: >-
      astro transitive dependency tree, pending the astro 6 -> 7 major upgrade
      tracked in SEC-126. Scoped to the site lockfile only — the application
      lockfile (pnpm-lock.yaml) is NOT covered by this entry.
    expired_at: 2026-10-08
